[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aegentra-backend"
version = "0.1.0"
description = "Shadow-mode foundation for Aegentra's evidence-first security platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-javascript>=0.25,<0.27",
  "rfc8785>=0.1.4,<1",
  "boto3>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aegentra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
