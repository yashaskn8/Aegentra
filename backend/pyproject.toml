[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aegentra-backend"
version = "0.1.0"
description = "Shadow-mode foundation for Aegentra's evidence-first security platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aegentra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
