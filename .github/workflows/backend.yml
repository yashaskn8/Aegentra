name: Backend checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run unit tests
        run: python -m pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    env:
      AEGENTRA_DATABASE_URL: postgresql+asyncpg://postgres:ci-admin-only@127.0.0.1:5432/aegentra_ci
      AEGENTRA_TEST_ADMIN_URL: postgresql+asyncpg://postgres:ci-admin-only@127.0.0.1:5432/aegentra_ci
      AEGENTRA_TEST_APP_URL: postgresql+asyncpg://aegentra_app:ci-app-only@127.0.0.1:5432/aegentra_ci
      AEGENTRA_TEST_BRIDGE_URL: postgresql+asyncpg://aegentra_bridge:ci-bridge-only@127.0.0.1:5432/aegentra_ci
      AEGENTRA_TEST_VALIDATOR_URL: postgresql+asyncpg://aegentra_validator:ci-validator-only@127.0.0.1:5432/aegentra_ci
      AEGENTRA_TEST_RELEASE_URL: postgresql+asyncpg://aegentra_release:ci-release-only@127.0.0.1:5432/aegentra_ci
      AEGENTRA_TEST_OBSERVER_URL: postgresql+asyncpg://aegentra_observer:ci-observer-only@127.0.0.1:5432/aegentra_ci
      AEGENTRA_TEST_OUTBOX_URL: postgresql+asyncpg://aegentra_outbox:ci-outbox-only@127.0.0.1:5432/aegentra_ci
      AEGENTRA_TEST_INCIDENT_URL: postgresql+asyncpg://aegentra_incident:ci-incident-only@127.0.0.1:5432/aegentra_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL natively (no containers)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-client
          sudo systemctl start postgresql
      - name: Create isolated test roles and database
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE postgres WITH PASSWORD 'ci-admin-only'"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE aegentra_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-app-only'"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE aegentra_bridge LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-bridge-only'"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE aegentra_validator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-validator-only'"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE aegentra_release LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-release-only'"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE aegentra_observer LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-observer-only'"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE aegentra_outbox LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-outbox-only'"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE aegentra_incident LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-incident-only'"
          sudo -u postgres createdb aegentra_ci
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Apply actual Alembic migration
        working-directory: backend
        run: alembic upgrade head
      - name: Grant least-privilege test table access
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d aegentra_ci -c "GRANT USAGE ON SCHEMA public TO aegentra_app; GRANT SELECT, INSERT, UPDATE, DELETE ON assets TO aegentra_app; GRANT SELECT ON evidence TO aegentra_app; GRANT SELECT ON identities TO aegentra_app; GRANT SELECT, INSERT, DELETE ON login_challenges TO aegentra_app; GRANT SELECT, INSERT, UPDATE, DELETE ON browser_sessions TO aegentra_app; GRANT SELECT, INSERT, UPDATE ON audit_streams, idempotency_requests TO aegentra_app; GRANT SELECT, INSERT ON audit_entries TO aegentra_app; GRANT SELECT, INSERT ON outbox_events TO aegentra_app; GRANT SELECT, INSERT, UPDATE ON investigation_cases, case_memberships, case_evidence TO aegentra_app; GRANT SELECT, INSERT, UPDATE ON staging_uploads, staging_parts TO aegentra_app; GRANT SELECT, INSERT, UPDATE ON scan_jobs TO aegentra_app"
      - name: Grant bridge-only custody and audit permissions
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d aegentra_ci -c "GRANT USAGE ON SCHEMA public TO aegentra_bridge; GRANT SELECT, UPDATE ON scan_jobs TO aegentra_bridge; GRANT SELECT ON scan_receipts TO aegentra_bridge; GRANT SELECT, INSERT, UPDATE ON guest_attempts TO aegentra_bridge; GRANT SELECT, INSERT ON guest_resources TO aegentra_bridge; GRANT SELECT, INSERT, UPDATE ON audit_streams TO aegentra_bridge; GRANT SELECT, INSERT ON audit_entries, outbox_events TO aegentra_bridge"
      - name: Grant separate validator-only receipt permissions
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d aegentra_ci -c "GRANT USAGE ON SCHEMA public TO aegentra_validator; GRANT SELECT, UPDATE ON scan_jobs TO aegentra_validator; GRANT SELECT ON guest_attempts TO aegentra_validator; GRANT SELECT, INSERT ON scan_receipts TO aegentra_validator; GRANT SELECT, INSERT, UPDATE ON audit_streams TO aegentra_validator; GRANT SELECT, INSERT ON audit_entries, outbox_events TO aegentra_validator"
      - name: Grant separate release-authority database permissions
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d aegentra_ci -c "GRANT USAGE ON SCHEMA public TO aegentra_release; GRANT SELECT, UPDATE ON release_org_guards TO aegentra_release; GRANT SELECT, INSERT, UPDATE ON release_targets, release_grants, release_selections TO aegentra_release; GRANT SELECT, INSERT ON release_endorsements TO aegentra_release; GRANT SELECT, INSERT, UPDATE ON release_publications TO aegentra_release; GRANT SELECT, INSERT, UPDATE ON audit_streams TO aegentra_release; GRANT SELECT, INSERT ON audit_entries, outbox_events TO aegentra_release"
      - name: Grant separate observer-only readback and guard permissions
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d aegentra_ci -c "GRANT USAGE ON SCHEMA public TO aegentra_observer; GRANT SELECT ON release_org_guards TO aegentra_observer; GRANT SELECT, UPDATE (guard, epoch) ON release_targets TO aegentra_observer; GRANT SELECT ON release_publications TO aegentra_observer; GRANT SELECT, UPDATE (status) ON release_grants TO aegentra_observer; GRANT SELECT, INSERT ON release_observations TO aegentra_observer; GRANT SELECT, INSERT, UPDATE ON audit_streams TO aegentra_observer; GRANT SELECT, INSERT ON audit_entries, outbox_events TO aegentra_observer"
      - name: Grant outbox-only lease and receipt permissions
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d aegentra_ci -c "GRANT USAGE ON SCHEMA public TO aegentra_outbox; GRANT SELECT ON audit_entries TO aegentra_outbox; GRANT SELECT, UPDATE (attempts, lease_generation, lease_nonce_hash, lease_expires, next_attempt_at, abandoned_at, last_error_code, delivered_at, delivery_reference) ON outbox_events TO aegentra_outbox"
      - name: Grant separate native incident-custodian permissions
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d aegentra_ci -c "GRANT USAGE ON SCHEMA public TO aegentra_incident; GRANT SELECT ON release_org_guards TO aegentra_incident; GRANT SELECT, UPDATE (guard, epoch) ON release_targets TO aegentra_incident; GRANT SELECT, UPDATE (status, revision) ON investigation_cases TO aegentra_incident; GRANT SELECT, INSERT ON incident_containment_receipts TO aegentra_incident; GRANT SELECT, INSERT, UPDATE ON audit_streams TO aegentra_incident; GRANT SELECT, INSERT ON audit_entries, outbox_events TO aegentra_incident"
      - name: Verify PostgreSQL isolation
        working-directory: backend
        run: python -m pytest -q tests/test_pg_integration.py tests/test_auth_integration.py tests/test_case_integration.py tests/test_upload_integration.py tests/test_scan_leases_integration.py tests/test_bridge_journal_integration.py tests/test_scan_receipt_integration.py tests/test_release_state_integration.py tests/test_witness_registration_integration.py tests/test_observation_integration.py tests/test_outbox_dispatch_integration.py tests/test_incident_containment_integration.py
