name: Adversarial security gates
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Test the CI guard itself
        run: python -m unittest discover -s scripts -p 'test_ci_security_gate.py' -v
      - name: Enforce pinned and least-privilege workflows
        run: python scripts/ci_security_gate.py policy
      - name: Scan tracked text for high-confidence credentials
        run: python scripts/ci_security_gate.py secrets

  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install security regression dependencies
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Require hostile-input and fail-closed regression cases
        working-directory: backend
        run: |
          python -m pytest -q --strict-markers --strict-config \
            --junitxml="$RUNNER_TEMP/adversarial.xml" \
            tests/test_native_deadline_supervisor.py \
            tests/test_native_creation_controller.py \
            tests/test_native_physical_controller.py \
            tests/test_native_attachment_inventory.py \
            tests/test_native_ami_preflight.py \
            tests/test_native_isolation_guard.py \
            tests/test_native_isolation_collector.py \
            tests/test_native_launch_preflight.py \
            tests/test_native_detach_collector.py \
            tests/test_native_detach_worker.py \
            tests/test_guest_protocol.py \
            tests/test_security_veto.py \
            tests/test_protected_gateway.py \
            tests/test_review_crypto.py \
            tests/test_origin_binding.py \
            tests/test_staging_proof.py
      - name: Reject any missing, failed or skipped adversarial evidence
        run: python scripts/ci_security_gate.py junit "$RUNNER_TEMP/adversarial.xml"

  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install independent Python advisory scanner
        run: python -m pip install pip-audit
      - name: Block Python dependency advisories
        run: pip-audit --strict backend


  python-lock-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Resolve Python 3.12 backend and dev wheels with SHA-256 hashes
        run: |
          python -m pip install "pip-tools==7.6.2"
          pip-compile --extra dev --generate-hashes --strip-extras \
            --output-file backend/requirements.lock backend/pyproject.toml
          python -m pip install --require-hashes -r backend/requirements.lock
      - name: Upload backend lock for independent verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-lock-bootstrap
          path: backend/requirements.lock
          if-no-files-found: error
          retention-days: 2
      - name: Capture generated public dependency hashes for review
        run: |
          printf 'AEGENTRA_PY_LOCK_BEGIN\\n'
          base64 --wrap=0 backend/requirements.lock
          printf '\\nAEGENTRA_PY_LOCK_END\\n'

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [frontend, infra]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Resolve npm dependency tree without lifecycle scripts
        working-directory: ${{ matrix.package }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Block high and critical npm advisories
        working-directory: ${{ matrix.package }}
        run: npm audit --audit-level=high
      - name: Export resolved npm lock for reproducible dependency review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-lock-${{ matrix.package }}
          path: ${{ matrix.package }}/package-lock.json
          if-no-files-found: error
          retention-days: 2

  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
