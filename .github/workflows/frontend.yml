name: Frontend build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Check TypeScript and build Vite
        run: npm run build
      - name: Test scoped console rendering
        run: npm run test
      - name: Install native Chromium and system libraries (no containers)
        run: npx playwright install --with-deps chromium
      - name: Test browser revocation and inert evidence
        run: npm run test:e2e
