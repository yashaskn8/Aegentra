name: AWS CDK native synthesis
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  synth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install CDK dependencies (no containers)
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run build
      - name: Assert infrastructure isolation properties
        run: npm test
      - name: Synthesize CloudFormation only
        run: npm run synth
